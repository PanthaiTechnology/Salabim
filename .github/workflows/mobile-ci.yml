name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**"]

defaults:
  run:
    working-directory: mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Build de release real (APK assinado / IPA) fica no Fastlane — ver devops/fastlane/.
  # Requer secrets de assinatura configurados no repositório antes de habilitar.
